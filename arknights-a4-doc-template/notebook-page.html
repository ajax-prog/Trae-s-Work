@font-face { font-family:"BigShoulders"; src:url("./_shared/fonts/BigShoulders-Regular.ttf") format("truetype"); font-weight:400; }

@font-face { font-family:"JetBrainsMono"; src:url("./_shared/fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight:400; }

@font-face { font-family:"InstrumentSans"; src:url("./_shared/fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight:400; }

:root{
  --paper:#f1f1ec;
  --ink:#17191a;
  --ink2:#35383a;
  --muted:#6e736c;
  --rule:#c7c8c1;
  --rule-soft:#d9dad4;
  --accent:#00a398;
  --accent2:#e4550f;
  --dark:#121415;
  --soft:#eaf4f2;
  --soft-warn:#fbebe3;
  --f-sans:"InstrumentSans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrainsMono","Menlo",monospace;
  --f-display:"BigShoulders","InstrumentSans",sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--f-sans);background:#26282a;color:var(--ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;}

@page{size:A4;margin:0;}

.page{
  position:relative;width:210mm;height:297mm;background:var(--paper);
  padding:13mm 14mm 10mm;display:flex;flex-direction:column;overflow:hidden;
}
.page::before{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(23,25,26,0.012) 0 0.06mm,transparent 0.06mm 5mm);
}

/* ---------- 页眉 ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:2.4mm;border-bottom:0.35mm solid var(--ink);flex:none;}
.head-l{display:flex;align-items:center;gap:3mm;}
.diamond{width:3.4mm;height:3.4mm;background:var(--accent);transform:rotate(45deg);flex:none;}
.brand-en{font-family:var(--f-mono);font-size:7.5pt;font-weight:700;letter-spacing:.26em;text-transform:uppercase;}
.brand-sub{font-family:var(--f-mono);font-size:6pt;letter-spacing:.16em;color:var(--muted);margin-top:.6mm;text-transform:uppercase;white-space:nowrap;}
.head-r{text-align:right;font-family:var(--f-mono);font-size:6.8pt;letter-spacing:.12em;color:var(--muted);line-height:1.6;}
.head-r b{color:var(--ink);font-weight:700;}

/* ---------- 信息条 ---------- */
.meta{margin-top:4mm;display:grid;grid-template-columns:1.2fr 1.4fr 0.9fr 1.4fr;gap:0;border-top:0.3mm solid var(--ink);border-bottom:0.3mm solid var(--ink);flex:none;}
.meta > div{padding:2.2mm 2mm;position:relative;}
.meta > div + div{border-left:0.2mm solid var(--rule);}
.meta .k{font-family:var(--f-mono);font-size:6.5pt;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;}
.meta .v{margin-top:1.2mm;font-family:var(--f-mono);font-size:10pt;letter-spacing:.05em;color:var(--ink);min-height:4mm;border-bottom:0.12mm solid var(--rule-soft);}

/* ---------- 书写区 ---------- */
.sheet{margin-top:5mm;display:grid;grid-template-columns:10mm 1fr;flex:1;}
.gutter{border-right:0.2mm solid var(--rule);padding-right:1.6mm;}
.gutter .n{display:flex;align-items:center;justify-content:flex-end;height:7mm;font-family:var(--f-mono);font-size:6.5pt;color:var(--muted);letter-spacing:.08em;}
.gutter .n.chk{color:var(--accent2);}
.lines .ln{height:7mm;border-bottom:0.12mm solid var(--rule);}

/* ---------- 底部 ---------- */
.foot{flex:none;margin-top:4mm;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-family:var(--f-mono);font-size:6.5pt;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding-top:2mm;border-top:0.2mm solid var(--rule);}
.foot > span:first-child{white-space:nowrap;}
.foot .bc{width:28mm;height:3.4mm;justify-self:center;opacity:.65;}
.foot .pg{justify-self:end;color:var(--ink);white-space:nowrap;}
.foot .pg b{color:var(--accent);}

/* 角标 */
.hair{position:absolute;left:6mm;right:6mm;height:0.15mm;background:var(--accent);}
.hair.t{top:5.5mm;}
.hair.b{bottom:5.5mm;}

/* 条码 */
.bc-svg{display:block;}
</style>
